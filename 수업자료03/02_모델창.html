    <title>버튼 이벤트</title>
    <style>
        *
        .di{
            margin: 15px;
            padding: 15px;
            width: 140px;
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            border: 1px solid #000;
            border-radius:  15px;

            cursor: pointer;
        }


        .outter{
            display: none;
            position: fixed;
            left: 0px;
            top: 0px;
            width: 100%;
            height: 1000px;
            /*background-color:  black;*/
            background-color: rgb(0, 0, 0, 0.4);
        }
        .inner{
            background-color: #fefefe;
            margin: 15% auto;
            width: 80%;
            height: 300px;
            border: 1px solid #888;
            border-radius: 10px;
        }

        .btn_close{
            margin-right: 20px;
            float: right;
            font-size: 28px;
            font-weight: bold;

            cursor: pointer;
        }
    </style>
</head>
