<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text"id="num1">
    <select id="op">
        <option value="1">+</option>
        <option value="2">-</option>
        <option value="3">*</option>
        <option value="4">/</option>
    </select>
    <input type="text"id="num2">
    <input type="button" value="결과" onclick="result()">
    <input type="text" id="result">

    <script>
        function result(){
            let num1 = document.getElementById('num1').value;
            let num2 = document.getElementById('num2').value;

            let op = document.getElementById('op').value;

            let sum = parseInt(num1) + parseInt(num2);
            let min = parseInt(num1) - parseInt(num2);
            let gop = parseInt(num1) * parseInt(num2);
            let naa = parseInt(num1) / parseInt(num2);
           
            if(op==1){
                document.getElementById('result').value = sum;
            }else if(op==2){
                document.getElementById('result').value = min;   
            }else if(op==3){
                document.getElementById('result').value = gop;   
            }else if(op==4){
                document.getElementById('result').value = naa;   
            }
       }
   </script>
</body>
</html>
