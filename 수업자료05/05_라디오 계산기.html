<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>라디오 계산기</h1>
    <input type="text" id="num1">
    <input type="radio" name="op" value="1" checked> +
    <input type="radio" name="op" value="2">-
    <input type="radio" name="op" value="3">*
    <input type="radio" name="op" value="4">/
    <input type="text" id="num2">
    <input type="button" value="결과" onclick="result()">
    <input type="text" id="result">

    <script>
        function result() {
            let result = new Array();
            let num1 = document.getElementById('num1').value;
            let num2 = document.getElementById('num2').value;
            let op = document.getElementsByName('op');
            console.log(op);
            for (let i = 0; i < op.length; i++) {
                if (op[i].checked) {
                    console.log(op[i]);
                    console.log(op[i].checked);
                    console.log(op[i].value);
                    if (op[i].value == 1) {
                        document.getElementById('result').value = Number(num1)+Number(num2);
                    } else if (op[i].value == 2) {
                        document.getElementById('result').value = Number(num1)-Number(num2);
                    } else if (op[i].value == 3) {
                        document.getElementById('result').value = Number(num1)*Number(num2);
                    } else if (op[i].value == 4) {
                        document.getElementById('result').value = Number(num1)/Number(num2);
                    }
                }
            }

        }

    </script>
</body>

</html>
