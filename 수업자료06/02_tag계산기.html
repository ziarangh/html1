<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" placeholder="첫 번째 수">

    <select>
        <option value="+">+</option>
        <option value="-">-</option>
    </select>
    <input type="text" placeholder="두 번째 수">
    <input type="button" value="계산" onclick="result()">
    <input type="text" placeholder="결과 출력">
    <script>
        let inputs = document.getElementsByTagName('input');
        let selects = document.getElementsByTagName('select');

        switch(selects[0].value){
            case '+':
                inputs[3].value = Number(inputs[0].value)+Number(inputs[1].value);
                break;
            case '-':
                inputs[3].value = Number(inputs[0].value)-Number(inputs[1].value);
                break;   
        }
    </script>
</body>
</html>
